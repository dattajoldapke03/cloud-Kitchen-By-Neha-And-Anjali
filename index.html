<!DOCTYPE html>
<html>
<head>
  <title>Cloud Kitchen | Premium</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Courier+Prime&display=swap" rel="stylesheet">
</head>
<body>

<div id="toast" class="toast"></div>

<div class="top-bar">
  <div class="logo">🍳 Cloud Kitchen</div>
  <div class="nav-btns">
    <button onclick="viewCart()">🛒 Cart</button>
    <button onclick="openAdmin()">📊 Admin</button>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<div id="loginPage" class="page">
  <div class="login-card">
    <h2>Welcome Back</h2>
    <input id="username" placeholder="Username"><br>
    <input id="password" type="password" placeholder="Password"><br>
    <button class="btn-primary" onclick="login()">Login</button>
  </div>
</div>

<div id="homePage" class="page">
  <div class="category-bar">
    <button onclick="displayProducts(products)">All</button>
    <button onclick="filterCat('veg')">Veg</button>
    <button onclick="filterCat('paratha')">Paratha</button>
    <button onclick="filterCat('nonveg')">NonVeg</button>
    <button onclick="filterCat('snacks')">Snacks</button>
    <button onclick="filterCat('drinks')">Drinks</button>
    <button onclick="filterCat('desserts')">Desserts</button>
  </div>
  <div id="products"></div>
</div>

<div id="cartPage" class="page">
  <h2>Your Shopping Cart</h2>
  <div id="cartItems" class="cart-container"></div>
  <div class="checkout-form">
    <input id="address" placeholder="Delivery Address">
    <h3>Payment Method</h3>
    <div class="pay-options">
      <label><input type="radio" name="pay" value="UPI" onclick="toggleUPI()"> UPI</label>
      <label><input type="radio" name="pay" value="COD" onclick="toggleUPI()"> COD</label>
    </div>
    <div id="upiBox" class="upi-box" style="display:none;">
      <input id="upi" placeholder="Enter UPI ID (e.g. user@okaxis)">
      <input id="upiPin" type="password" maxlength="6" placeholder="Enter 6-Digit PIN">
      <p id="upiError" style="color:red;display:none;font-size:12px;">❌ Invalid UPI ID or PIN</p>
    </div>
    <button class="btn-order" onclick="placeOrder()">Place Order</button>
  </div>
</div>

<div id="billPage" class="page">
  <div id="invoiceContainer"><div id="bill"></div></div>
  <div class="bill-actions no-print">
    <button onclick="printBill()" style="background: #3498db;">📥 Download PDF / Print</button>
    <button onclick="showPage('homePage')" style="background: #7f8c8d;">Back to Menu</button>
  </div>
</div>

<div id="adminPage" class="page">
  <h2>Order Management</h2>
  <div id="orders"></div>
  <button onclick="showPage('homePage')">Back to Home</button>
</div>

<script src="script.js"></script>
</body>
</html>
